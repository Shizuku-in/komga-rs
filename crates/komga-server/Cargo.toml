[package]
name = "komga-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["webui"]
heif-native = ["komga-media/heif-native"]
webui = [
  "dep:include_dir",
  "dep:mime_guess",
  "tower-http/compression-br",
  "tower-http/compression-gzip",
]

[dependencies]
anyhow.workspace = true
async-stream.workspace = true
axum.workspace = true
base64.workspace = true
bcrypt.workspace = true
clap.workspace = true
cookie.workspace = true
chrono.workspace = true
dashmap.workspace = true
futures-core.workspace = true
futures-util.workspace = true
headers-accept.workspace = true
hex.workspace = true
http.workspace = true
httpdate.workspace = true
include_dir = { workspace = true, optional = true }
komga-core = { path = "../komga-core" }
komga-media = { path = "../komga-media" }
komga-search = { path = "../komga-search" }
komga-storage = { path = "../komga-storage" }
mediatype.workspace = true
mime_guess = { workspace = true, optional = true }
moka.workspace = true
oauth2.workspace = true
openidconnect.workspace = true
percent-encoding.workspace = true
rand.workspace = true
quick-xml.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["io", "io-util"] }
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
url.workspace = true
walkdir.workspace = true
zip.workspace = true

[dev-dependencies]
http-body-util.workspace = true
pdf-writer.workspace = true
roxmltree.workspace = true
sqlx.workspace = true
tower.workspace = true
