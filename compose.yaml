services:
  komga:
    image: komga-rs:local
    build:
      context: .
    init: true
    restart: unless-stopped
    ports:
      - "${KOMGA_HTTP_PORT:-25600}:25600"
    environment:
      KOMGA_CONFIG_DIR: /config
    volumes:
      - komga-config:/config
      - type: bind
        source: ${KOMGA_LIBRARY_DIR:-./books}
        target: /data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  komga-config:
