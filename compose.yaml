services:
  komga:
    image: ${KOMGA_IMAGE:-komga-rs:local}
    build:
      context: .
    init: true
    restart: unless-stopped
    ports:
      - "${KOMGA_HTTP_PORT:-25600}:25600"
    environment:
      KOMGA_CONFIG_DIR: /config
      # Override TZ in .env when local timestamps should use another timezone.
      TZ: ${TZ:-UTC}
    volumes:
      # Set these host paths in .env before starting Compose, for example:
      # KOMGA_CONFIG_HOST_DIR=/srv/komga/config
      # KOMGA_LIBRARY_DIR=/srv/books
      # Both directories must be accessible to UID/GID 1000. Keep the library
      # writable if Komga will import, delete, convert, or repair source files.
      - type: bind
        source: ${KOMGA_CONFIG_HOST_DIR:-./config}
        target: /config
      - type: bind
        source: ${KOMGA_LIBRARY_DIR:-./books}
        target: /data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
