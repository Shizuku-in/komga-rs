name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      run_full: ${{ steps.scope.outputs.run_full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine CI scope
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          run_full=true
          reason="full CI is the safe default"
          changed_files=()
          changed_file_list="$RUNNER_TEMP/changed-files"
          zero_sha="0000000000000000000000000000000000000000"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only -z "$BASE_SHA...$HEAD_SHA" > "$changed_file_list"
            mapfile -d '' -t changed_files < "$changed_file_list"
          elif [[ "$EVENT_NAME" == "push" && "$BEFORE_SHA" != "$zero_sha" ]]; then
            git diff --name-only -z "$BEFORE_SHA" "$GITHUB_SHA" > "$changed_file_list"
            mapfile -d '' -t changed_files < "$changed_file_list"
          else
            reason="new branches and unknown events require full CI"
          fi

          docs_only=false
          if (( ${#changed_files[@]} > 0 )); then
            docs_only=true
            for changed_file in "${changed_files[@]}"; do
              case "$changed_file" in
                *.md|LICENSE|*/LICENSE|LICENSE.*|*/LICENSE.*|.github/readme-images/*|docs/*.gif|docs/*.jpeg|docs/*.jpg|docs/*.png|docs/*.svg|docs/*.webp)
                  ;;
                *)
                  docs_only=false
                  break
                  ;;
              esac
            done
          fi

          if [[ "$docs_only" == "false" ]]; then
            reason="the change includes files that can affect the product or CI"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            run_full=false
            reason="the pull request changes documentation only"
          else
            successful_runs="$(
              gh api \
                "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$BEFORE_SHA&event=push&status=completed&per_page=100" \
                --jq '.workflow_runs[] | select(.conclusion == "success") | .head_branch' \
                | grep -Fxc "$BRANCH_NAME" || true
            )"
            if [[ "$successful_runs" -gt 0 ]]; then
              run_full=false
              reason="the push changes documentation only and its parent has successful CI"
            else
              reason="the documentation-only push has no successful CI result for its parent"
            fi
          fi

          echo "run_full=$run_full" >> "$GITHUB_OUTPUT"
          {
            echo "### CI scope"
            echo "- Full CI: \`$run_full\`"
            echo "- Changed files: ${#changed_files[@]}"
            echo "- Reason: $reason"
          } >> "$GITHUB_STEP_SUMMARY"

  workflows:
    needs: changes
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  webui:
    needs: changes
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit -- --runInBand
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: webui/dist
          if-no-files-found: error
          retention-days: 1

  msrv:
    needs: [changes, webui]
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KOMGA_WEBUI_DIST_DIR: webui/dist
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked
      - run: cargo check -p komga-server --all-targets --no-default-features --locked

  test:
    needs: [changes, webui]
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      KOMGA_WEBUI_DIST_DIR: webui/dist
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  native-codecs:
    needs: [changes, webui]
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      KOMGA_WEBUI_DIST_DIR: webui/dist
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist
      - run: sudo apt-get update
      - run: sudo apt-get install --yes pkg-config libheif-dev libheif-plugin-libde265 libheif-plugin-dav1d
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p komga-media -p komga-server --all-targets --locked --features komga-media/heif-native,komga-server/heif-native -- -D warnings
      - run: cargo test -p komga-media -p komga-server --all-targets --locked --features komga-media/heif-native,komga-server/heif-native

  docker:
    needs: changes
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: komga-rs:ci
          cache-from: type=gha,scope=komga-rs-container
          cache-to: type=gha,mode=max,scope=komga-rs-container
      - name: Start container and wait for health check
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name komga-rs-ci komga-rs:ci
          trap 'docker logs komga-rs-ci; docker rm --force komga-rs-ci' EXIT
          deadline=$((SECONDS + 60))
          while (( SECONDS < deadline )); do
            status="$(docker inspect --format '{{.State.Health.Status}}' komga-rs-ci)"
            if [[ "$status" == healthy ]]; then
              exit 0
            fi
            if [[ "$status" == unhealthy ]]; then
              exit 1
            fi
            sleep 2
          done
          echo "::error::container did not become healthy within 60 seconds"
          exit 1

  e2e:
    needs: [changes, webui]
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      KOMGA_WEBUI_DIST_DIR: webui/dist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: webui
      - run: npx playwright install --with-deps chromium
        working-directory: webui
      - run: npm run test:e2e
        working-directory: webui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            webui/playwright-report
            webui/test-results
          if-no-files-found: ignore
          retention-days: 7
