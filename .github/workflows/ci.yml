name: Rust CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  webui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit -- --runInBand
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: webui/dist
          if-no-files-found: error

  msrv:
    needs: webui
    runs-on: ubuntu-latest
    env:
      KOMGA_WEBUI_DIST_DIR: webui/dist
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked
      - run: cargo check -p komga-server --all-targets --no-default-features --locked

  test:
    needs: webui
    runs-on: ubuntu-latest
    env:
      KOMGA_WEBUI_DIST_DIR: webui/dist
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  native-codecs:
    needs: webui
    runs-on: ubuntu-24.04
    env:
      KOMGA_WEBUI_DIST_DIR: webui/dist
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist
      - run: sudo apt-get update
      - run: sudo apt-get install --yes pkg-config libheif-dev libheif-plugin-libde265 libheif-plugin-dav1d
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --features komga-media/heif-native,komga-server/heif-native -- -D warnings
      - run: cargo test --workspace --all-targets --features komga-media/heif-native,komga-server/heif-native

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: komga-rs:ci
          cache-from: type=gha,scope=komga-rs-container
          cache-to: type=gha,mode=max,scope=komga-rs-container
      - name: Start container and wait for health check
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name komga-rs-ci komga-rs:ci
          trap 'docker logs komga-rs-ci; docker rm --force komga-rs-ci' EXIT
          for attempt in {1..30}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' komga-rs-ci)"
            if [[ "$status" == healthy ]]; then
              exit 0
            fi
            if [[ "$status" == unhealthy ]]; then
              exit 1
            fi
            sleep 2
          done
          exit 1

  e2e:
    needs: webui
    runs-on: ubuntu-latest
    env:
      KOMGA_WEBUI_DIST_DIR: webui/dist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: webui
      - run: npx playwright install --with-deps chromium
        working-directory: webui
      - run: npm run test:e2e
        working-directory: webui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            webui/playwright-report
            webui/test-results
          if-no-files-found: ignore
