[workspace]
members = [
  "crates/komga-core",
  "crates/komga-media",
  "crates/komga-search",
  "crates/komga-server",
  "crates/komga-storage",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.96.1"

[workspace.dependencies]
anyhow = "1.0"
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
bcrypt = "0.17"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
cookie = "0.18"
dashmap = "6.1"
ego-tree = "0.11"
futures-core = "0.3"
futures-util = "0.3"
flate2 = "1.1"
hayro = "0.7.1"
hayro-write = "0.7.0"
headers-accept = "0.3.0"
hex = "0.4"
html5ever = "0.39"
http = "1.3"
http-body-util = "0.1"
httpdate = "1.0"
include_dir = "0.7.4"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
infer = "0.22"
iso8601-duration = "0.2"
mime_guess = "2.0.5"
rand = "0.9"
rars = "0.4.7"
quick-xml = "0.38"
regex = "1.11"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "macros", "migrate", "regexp", "runtime-tokio", "sqlite"] }
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.17", features = ["v4"] }
url = "2.5"
walkdir = "2.5"
natord = "1.0"
mediatype = "0.21.0"
moka = { version = "0.12", features = ["future"] }
md-5 = "0.10"
pdf-writer = "0.15.0"
percent-encoding = "2.3"
roxmltree = "0.21"
scraper = "0.27"
unicode-normalization = "0.1"
tantivy = "0.26.1"
zip = { version = "8.6", default-features = false, features = ["bzip2", "deflate", "deflate64", "lzma", "ppmd", "xz", "zstd"] }
xxhash-rust = { version = "0.8.18", default-features = false, features = ["xxh3"] }

[profile.release]
lto = "thin"
strip = "symbols"
